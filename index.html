<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trees of England — A Pocket Field Guide</title>
  <meta name="description" content="A well-worn pocket field guide to trees growing wild in England. Start at page one and follow the key until the tree is named.">
  <meta name="theme-color" content="#cbb892">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trees of England">
  <link rel="icon" href="assets/acorn-icon.jpg">
  <link rel="apple-touch-icon" href="assets/acorn-icon.jpg">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/guide.css">
</head>
<body>
  <div class="desk">
    <main class="book" id="book" role="main">
      <header class="book-top">
        <button type="button" id="homeBtn" class="home-btn" title="Begin again" aria-label="Return to the beginning of the guide">
          <img src="assets/acorn-icon.jpg" alt="">
        </button>
        <p class="running" id="runningTitle">Trees of England</p>
        <span class="home-spacer" aria-hidden="true"></span>
      </header>
      <article id="sheet" class="sheet" aria-live="polite"></article>
      <footer class="book-bottom">
        <button type="button" id="prevBtn" class="page-turn prev" aria-label="Turn to the previous page">
          <span class="corner"></span>
          <span class="turn-label">back</span>
        </button>
        <p class="folio" id="folio"></p>
        <button type="button" id="nextBtn" class="page-turn next" aria-label="Turn to the next page">
          <span class="corner"></span>
          <span class="turn-label">on</span>
        </button>
      </footer>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/species.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
